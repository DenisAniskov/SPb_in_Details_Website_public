name: Public website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only permissions: no secrets, deployment or repository writes.
permissions:
  contents: read

concurrency:
  group: public-website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Astro, release metadata and MIT
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'

    steps:
      - name: Checkout public sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate Astro and TypeScript
        run: npm run check

      - name: Check public MIT and publication metadata (offline)
        run: node scripts/verify-publication-metadata.mjs

      - name: Compare release metadata with the published GitHub Release
        run: npm run verify:metadata -- --github

      - name: Build static website and verify output
        run: npm run build
